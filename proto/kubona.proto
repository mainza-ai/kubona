syntax = "proto3";

package kubona;

option go_package = "github.com/mainza-ai/kubona/core/proto;kubonaproto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_PAUSED = 5;
  JOB_STATUS_CANCELLED = 6;
}

enum DegradationLevel {
  DEGRADATION_UNSPECIFIED = 0;
  DEGRADATION_QPU_HARDWARE = 1;
  DEGRADATION_AER_NOISE_SIM = 2;
  DEGRADATION_STATEVECTOR_SIM = 3;
  DEGRADATION_CLASSICAL_FALLBACK = 4;
}

message CircuitExecutionRequest {
  string job_id = 1;
  string session_id = 2;
  string qasm = 3;
  int32 shots = 4;
  string requested_backend = 5;
  bool allow_classical_fallback = 6;
  // P5 §2.9 routing: caller-declared jurisdictions + export-control class.
  // The bridge refuses hardware execution when these are absent or the
  // route() verdict is INELIGIBLE — compliance gate, not afterthought.
  repeated string caller_jurisdictions = 7;
  string caller_export_class = 8;
  bool export_reviewed = 9;
}

message CircuitExecutionResponse {
  string job_id = 1;
  bool success = 2;
  string resolved_backend = 3;
  DegradationLevel degradation_level = 4;
  string degradation_reason = 5;
  map<string, int64> counts = 6;
  repeated double statevector_real = 7;
  repeated double statevector_imag = 8;
  double meyer_wallach_entanglement = 9;
  double execution_time_ms = 10;
  string error_message = 11;
  // W1.8: the real provider-side job id when hardware ran (executor
  // already produced it; the wire dropped it). Empty for simulators —
  // never a fabricated id.
  string hardware_job_id = 12;
}

message CircuitCutRequest {
  string qasm = 1;
  int32 max_subcircuit_qubits = 2;
}

message SubcircuitFragment {
  int32 fragment_id = 1;
  string qasm = 2;
  repeated int32 cut_qubits = 3;
}

message CircuitCutResponse {
  bool success = 1;
  repeated SubcircuitFragment fragments = 2;
  int32 total_cuts = 3;
  string error_message = 4;
  // W1.8: quasi-probability sampling overhead (4^K, capped server-side).
  // 1.0 when N/A. The executor computed it; the wire dropped it.
  double sampling_overhead_kappa = 5;
}

message ClassicalAnchorRequest {
  string molecule = 1;
  double bond_distance = 2;
  string basis_set = 3;
}

message ClassicalAnchorResponse {
  string molecule = 1;
  double bond_distance = 2;
  double rhf_energy = 3;
  double fci_exact_energy = 4;
  double nuclear_repulsion = 5;
  repeated double orbital_energies = 6;
  bool success = 7;
  string error_message = 8;
}

message ClaimEvaluationRequest {
  string claim_id = 1;
  string statement = 2;
  double quantum_value = 3;
  double classical_anchor_value = 4;
  repeated string source_platforms = 5;
  int64 total_engagement = 6;
  double contradiction_signal = 7;
}

message ClaimEvaluationResponse {
  string claim_id = 1;
  double corroborated_amplitude = 2;
  double contested_amplitude = 3;
  double unverified_amplitude = 4;
  bool passes_chemical_accuracy = 5;
  double delta_mha = 6;
  bool quantum_advantage_claimed = 7;
  bool quantum_advantage_verified = 8;
  string verdict_reason = 9;
  // W1.8: the response carried no success/error — callers could not tell
  // evaluation from transport failure. Now explicit, like every other RPC.
  bool success = 10;
  string error_message = 11;
}

message LiteratureGroundingRequest {
  string query = 1;
  int32 limit = 2;
}

message LiteratureRecord {
  string id = 1;
  string title = 2;
  string authors = 3;
  string abstract_text = 4;
  string url = 5;
  int32 publication_year = 6;
  int32 citation_count = 7;
}

message LiteratureGroundingResponse {
  repeated LiteratureRecord records = 1;
  bool cached = 2;
}

message QuantumKrylovRequest {
  string molecule = 1;
  double bond_distance = 2;
  int32 subspace_dimension = 3;
  double time_step = 4;
  int32 shots = 5;
  string requested_backend = 6;
}

message QuantumKrylovResponse {
  bool success = 1;
  double ground_state_energy = 2;
  double classical_fci_energy = 3;
  repeated double subspace_eigenvalues = 4;
  int32 subspace_dimension = 5;
  double meyer_wallach_entanglement = 6;
  double execution_time_ms = 7;
  string error_message = 8;
  // J5: which solver produced this result. "numerical-krylov" = real
  // expm + Hc=ESc solve (H2); "analytical-sequence" = corridor schedule
  // off the FCI anchor (other molecules). Consumers must not treat the
  // analytical path as a measurement (MW folds only for numerical).
  string solver = 9;
}

message MitigationRequest {
  string qasm = 1;
  string method = 2;
  repeated double scale_factors = 3;
  int32 shots = 4;
}

message MitigationResponse {
  bool success = 1;
  double unmitigated_value = 2;
  double mitigated_value = 3;
  double error_bound = 4;
  string method_used = 5;
  string error_message = 6;
  // W1.8: PEC sampling overhead (gamma); 0 when N/A (ZNE/CDR carry no
  // kappa concept — 0 means unset, never a measurement).
  double sampling_overhead_kappa = 7;
}

// Chemistry rails (T-01a): schemaless science payloads ride as JSON
// strings. The Python functions return evolving Dict[str, Any] and the Go
// consumers treat them as map[string]any — a typed mirror would be a
// third schema to drift. The proto carries transport framing
// (success/error_message per the servicer failure contract); the JSON
// carries the science. Never a generic snippet-exec RPC: operations are
// the closed vocabulary below.
message ChemistryADMETRequest {
  string smiles = 1;
}

message ChemistryADMETResponse {
  bool success = 1;
  string result_json = 2;
  string error_message = 3;
}

message DiscoveryCandidate {
  string name = 1;
  string smiles = 2;
}

message DiscoveryPipelineRequest {
  string target = 1;
  repeated DiscoveryCandidate candidates = 2;
}

message DiscoveryPipelineResponse {
  bool success = 1;
  string result_json = 2;
  string error_message = 3;
}

// Codesign rail (T-01b): one RPC with a closed operation vocabulary
// (evaluate/batch/families/packs/budget). The operation selects a
// function in bridge/codesign_ops.py — never caller-supplied code.
// Same JSON-string framing as chemistry: the science payload evolves,
// the proto carries transport only.
message CodesignRequest {
  string operation = 1;
  string request_json = 2;
}

message CodesignResponse {
  bool success = 1;
  string result_json = 2;
  string error_message = 3;
}

service QuantumBridgeService {
  rpc ExecuteCircuit(CircuitExecutionRequest) returns (CircuitExecutionResponse);
  rpc CutCircuit(CircuitCutRequest) returns (CircuitCutResponse);
  rpc ComputeClassicalAnchor(ClassicalAnchorRequest) returns (ClassicalAnchorResponse);
  rpc EvaluateWavefunction(ClaimEvaluationRequest) returns (ClaimEvaluationResponse);
  rpc GroundLiterature(LiteratureGroundingRequest) returns (LiteratureGroundingResponse);
  rpc ExecuteQuantumKrylov(QuantumKrylovRequest) returns (QuantumKrylovResponse);
  rpc MitigateCircuit(MitigationRequest) returns (MitigationResponse);
  rpc EvaluateMolecularADMET(ChemistryADMETRequest) returns (ChemistryADMETResponse);
  rpc EvaluateDiscoveryPipeline(DiscoveryPipelineRequest) returns (DiscoveryPipelineResponse);
  rpc EvaluateCodesign(CodesignRequest) returns (CodesignResponse);
}

// R1 — canonical evidence envelope: one receipt identity across both
// ledgers. The sealed form is canonical JSON bytes (sorted keys, compact,
// UTF-8, finite floats only); evidence_id = "ev_" + sha256 hex of those
// bytes. The JSON form is what Go (pkg/ledger/envelope.go) and Python
// (kubona/provenance/envelope.py) both build and verify against the SAME
// checked-in vectors (platform/contracts/evidence-vectors.json). This
// message is the schema home for transport; the bytes are the seal.
message EvidenceEnvelope {
  string evidence_id = 1;
  string normalized_result_json = 2;
  string raw_result_json = 3;
  string analysis_profile_json = 4;
  string tenant_id = 5;
  string mandate_ref_json = 6;
}

