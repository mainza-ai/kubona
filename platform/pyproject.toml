[project]
name = "kubona-platform"
version = "0.1.0"
description = "Kubona — open-source, MCP-native quantum-computing and AI-enhanced science discovery platform. Phase 0 skeleton."
requires-python = ">=3.11"
dependencies = [
    # Pinned == : the suite-verified set (2026-10-12). Floors rot CI into
    # untested version combos; absent extras keep >= (unverifiable here).
    "mcp==2.3.0",
    "pydantic==2.13.5",
    # numpy is interpreter-sensitive: 2.5.x needs Python >=3.12 but CI runs
    # 3.11, so the pin splits by marker — each lane is the suite-verified
    # version for that interpreter (2.4.6 is what >= floors resolved on 3.11).
    "numpy==2.5.3; python_version >= '3.12'",
    "numpy==2.4.6; python_version < '3.12'",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "PyNaCl==1.6.2",
    "PyYAML==6.0.3",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "grpcio==1.84.0",
    "protobuf==5.29.6",
    # W2.4: scipy + pennylane were imported but undeclared (krylov needs
    # scipy.linalg; cutting/diff-stack need pennylane) — CI resolved them
    # transitively or not at all. scipy splits by interpreter like numpy
    # (1.18.x needs >=3.12); pennylane covers >=3.11 in one pin.
    "scipy==1.18.1; python_version >= '3.12'",
    "scipy==1.15.3; python_version < '3.12'",
    "pennylane==0.45.1",
]

[project.scripts]
kubona = "kubona.run:_cli"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
qiskit = ["qiskit==2.5.2", "qiskit-aer==0.17.2", "qiskit-ibm-runtime==0.50.0"]
chemistry = ["pyscf==2.14.0", "rdkit==2026.3.6"]
providers = [
    # Pinned == : the suite-verified set (2026-10-28). Each pin names the
    # suite that verified it — a pin without a green suite is a guess, not
    # a pin (same discipline as the core deps above).
    # pytket: tests/test_g6_real_sdk.py::test_pytket_real_conversion (live
    # BELL + parametric VQE2 Circuit conversion) + tests/test_qpu_providers.py
    # + tests/test_sdk_conformance.py, all green with the SDK importable.
    "pytket==2.18.5",
    # pytket-quantinuum stays FLOATING on purpose: no suite exercises the
    # Quantinuum submission path (credential + network gated, fail-closed by
    # design), and the provider's `from pytket_quantinuum import ...` path
    # matches no published namespace layout (0.28.0 and 0.59.3 both ship
    # `pytket.extensions.quantinuum`), so no == is verifiable here —
    # operators pin per-deployment once the submission path is wired+tested.
    "pytket-quantinuum",
    # pyquil: tests/test_g6_real_sdk.py::test_pyquil_real_conversion (live
    # BELL + parametric conversion incl. CX->CNOT) + tests/test_qpu_providers.py
    # + tests/test_sdk_conformance.py, all green with the SDK importable.
    "pyquil==4.22.0",                     # Rigetti (WavefunctionSimulator is credential-free w/ qvm)
    # dimod: tests/test_w2_production_bar.py::test_annealing_labels_and_validates
    # (exact + heuristic QUBO paths, non-square/non-finite refusals).
    "dimod==0.12.23",                     # D-Wave annealer (credential-free QUBO solver)
    # strawberryfields: FINAL archived release (0.23.0 is the last one).
    # Verified via tests/test_w2_production_bar.py (SDK-missing branch — the
    # 0.23.0 `import pkg_resources` fails on modern setuptools, so the
    # provider stays fail-closed on that branch) + the not-wired branch for
    # the modality split. Revisit only if the provider is ever wired live.
    "strawberryfields==0.23.0",           # Xanadu photonic/CV (modality-gated)
    # pulser: tests/test_w2_production_bar.py::test_neutral_photonic_split_sdk_vs_wiring
    # takes the not-yet-wired branch with the SDK importable (fail-closed).
    "pulser==1.9.1",                      # QuEra/Pasqal neutral atom (modality-gated)
]
# langgraph: tests/test_langgraph_shim.py (VQE StateGraph end-to-end, runs
# for real once the extra is installed — skipped without it).
orchestration = ["langgraph==1.2.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kubona*"]

# Runtime data ships with the wheel/image. Setuptools only packages *.py by
# default; without this, the bridge boots but its first local-simulator
# submit fails with "no capability schema" (E2E 2026-10-30).
[tool.setuptools.package-data]
"kubona.schema" = ["providers/*.json"]
"kubona.eval" = ["corpora/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Paper-scale lane selection is path-based (tests/test_codesign_slice*.py),
# not marker-based: every paper-scale verification file rides the slow
# shards by location, so new slice files land there with no tagging step.
# (-m slow was tried 2026-10-22 and abandoned: the hog set was wider than
# any hand-maintained list; the fast lane's --durations output is the
# ongoing census instead.)

[tool.ruff]
# Phase-1 lint gate (see ci.yml python-lint job + .github/ruff-baseline.txt).
# target-version pins rule applicability to the CI interpreter (3.11) so
# local runs on newer Pythons count identically; default select (E4/E7/E9/F)
# is intentionally unchanged — the gate is a hold-the-line COUNT ratchet,
# not a curated subset, so narrowing rules here would silently move the goal.
target-version = "py311"
