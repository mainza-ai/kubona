[project]
name = "kubona-platform"
version = "0.1.0"
description = "Kubona — open-source, MCP-native quantum-computing and AI-enhanced science discovery platform. Phase 0 skeleton."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "cryptography>=42.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
orchestration = ["langgraph>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kubona*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
