# Advisory gate for the Rust crates. Licenses and bans are not this check:
# `scripts/dependency_audit.py` runs `cargo deny check advisories` only.
# Waivers do not live here. They live in
# platform/contracts/dependency-audit-exceptions.json, which requires an
# owner and an expiry no more than 120 days out.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []
