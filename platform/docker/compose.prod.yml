# Kubona production stack (D1 skeleton).
#
#   kubonad :8080  <- console + operator (Go orchestrator, SQLite ledger)
#   bridge  unix:///run/kubona/bridge.sock <- kubonad only (Python gRPC
#             compute over a shared-volume UDS; NO TCP in production)
#   console :3000  <- browser (Next.js standalone)
#
# Deliberately absent: vault (dev-only compose; promotion needs real
# storage + init/unseal + TLS — see docker-compose.vault.yml header),
# pgvector (dormant by design, Q-34; start docker-compose.hindsight.yml
# explicitly if a memory experiment needs it).
#
# Up:   docker compose -f platform/docker/compose.prod.yml up --build -d
# Down: docker compose -f platform/docker/compose.prod.yml down
#
# Writes need KUBONA_API_TOKEN in the environment (export it first):
# unset means bearer-gated routes 503 with "API token not configured"
# (fail-closed, by design). Reads stay public behind limiters.
# TLS: terminate in front (reverse proxy) or mount PEM into kubonad and
# extend its command with --tls-cert/--tls-key [--tls-required].

name: kubona-prod

services:
  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    image: kubona/bridge:prod
    environment:
      KUBONA_ENV: "production"
      # The bridge is a private compute plane. Production transport is
      # UDS-exclusive over the shared bridge-sock volume: no TCP socket
      # exists at all (the bridge refuses TCP in KUBONA_ENV=production),
      # so there is nothing to sniff or to bind. kubonad dials the same
      # socket path. Both images run as UID 1000 and both bake
      # /run/kubona owned by kubona:kubona so the seeded volume is
      # writable. If the token is unset the bridge still refuses to
      # serve authenticated RPCs (fail-closed).
      KUBONA_BRIDGE_SOCKET: /run/kubona/bridge.sock
      KUBONA_BRIDGE_TOKEN: ${KUBONA_BRIDGE_TOKEN:-${KUBONA_API_TOKEN:-}}
      # IBM credentials are consumed by the bridge's qiskit provider, not
      # by kubonad. Keep them explicit so the private compute plane can
      # dispatch without baking secrets into the image.
      KUBONA_IBM_QISKIT_TOKEN: ${KUBONA_IBM_QISKIT_TOKEN:-}
      KUBONA_IBM_QISKIT_INSTANCE: ${KUBONA_IBM_QISKIT_INSTANCE:-}
      KUBONA_IBM_QISKIT_CHANNEL: ${KUBONA_IBM_QISKIT_CHANNEL:-ibm_quantum_platform}
      KUBONA_IBM_QISKIT_BACKEND: ${KUBONA_IBM_QISKIT_BACKEND:-}
      KUBONA_IBM_MAX_EXECUTION_SECONDS: ${KUBONA_IBM_MAX_EXECUTION_SECONDS:-600}
    volumes:
      - bridge-sock:/run/kubona
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('unix:///run/kubona/bridge.sock')).result(timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s

  kubonad:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kubonad
      args:
        VERSION: ${KUBONA_VERSION:-dev}
    image: kubona/kubonad:prod
    command: ["--bind", "0.0.0.0", "--port", "8080"]
    environment:
      KUBONA_ENV: "production"
      # Bridge dial: --bridge flag intentionally left at its default
      # (localhost:50051) so KUBONA_BRIDGE_SOCKET takes precedence in
      # kubonad's dial logic — the Go side joins the same UDS, never TCP.
      KUBONA_BRIDGE_SOCKET: /run/kubona/bridge.sock
      # Explicit single-lab posture (Q-57). Set to "0" for a multi-lab
      # deployment; anonymous session reads then require auth.
      KUBONA_SINGLE_LAB: ${KUBONA_SINGLE_LAB:-1}
      KUBONA_API_TOKEN: ${KUBONA_API_TOKEN:-}
      # Shared secret for the private bridge RPCs. Defaults to the API
      # token so the supported quickstart needs one value, not two.
      KUBONA_BRIDGE_TOKEN: ${KUBONA_BRIDGE_TOKEN:-${KUBONA_API_TOKEN:-}}
      # Audit 2026-10-21: Strata is the default provider (local, keyless),
      # but the stack never configured its model — every LLM path refused
      # with "no model configured" on a stock up. .env.example names iq3_s
      # as the default; the compose default matches it (overridable via
      # environment, never a rebuild).
      STRATA_MODEL: ${STRATA_MODEL:-iq3_s}
      # Strata serves on the HOST's loopback (serving panel default
      # 127.0.0.1:47831), which is not the container's loopback.
      # host.docker.internal resolves on Docker Desktop (Mac/Win) and via
      # host-gateway on Linux (see extra_hosts below); verified live
      # 2026-10-21 (models list answers through it). Point STRATA_BASE_URL
      # elsewhere only if Strata itself moves.
      STRATA_BASE_URL: ${STRATA_BASE_URL:-http://host.docker.internal:47831/v1}
      # Plain HTTP inside the compose network only: kubonad itself
      # refuses non-loopback plaintext without TLS or this explicit
      # opt-in. TLS terminates in front (reverse proxy) or via mounted
      # PEM + --tls-cert/--tls-key flags — never expose :8080 directly.
      KUBONA_ALLOW_PLAINTEXT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    # Runbook: if host localhost:8080 answers with sessions the stack
    # never created, a dev daemon owns the host port (it binds before /
    # beside Docker's forward). The stack itself is unaffected — probe it
    # in-network (docker exec <svc> curl kubonad:8080/...) — but stop the
    # dev daemon before trusting host-port curls.
    volumes:
      - kubona-state:/home/kubona/.kubona
      - bridge-sock:/run/kubona
    depends_on:
      bridge:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  console:
    build:
      context: ../console
      dockerfile: ../docker/Dockerfile.console
      args:
        NEXT_PUBLIC_API_URL: ${KUBONA_CONSOLE_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_KUBONA_VERSION: ${KUBONA_VERSION:-dev}
    image: kubona/console:prod
    ports:
      - "3000:3000"
    depends_on:
      kubonad:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  kubona-state:
  bridge-sock:
