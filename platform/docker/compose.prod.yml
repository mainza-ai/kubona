# Kubona local-first production stack.
#
#   kubonad :8080  <- console + operator (Go orchestrator, SQLite ledger)
#   bridge  unix:///run/kubona/bridge.sock <- kubonad only (Python gRPC
#             compute over a shared-volume UDS; NO TCP in production)
#   console :3000  <- browser (Next.js standalone)
#
# LOCAL-FIRST POSTURE: both published ports bind to 127.0.0.1. The stack is
# unreachable from the LAN/public interface by default. There is no domain,
# Cloudflare, reverse proxy, or public certificate in the supported path.
# The only cloud egress is QPU dispatch (bridge) and opt-in cloud LLM
# (kubonad, KUBONA_LLM_CLOUD=1); everything else works offline.
#
# Remote access is an explicit opt-in: SSH tunnel
#   ssh -L 3000:127.0.0.1:3000 -L 8080:127.0.0.1:8080 user@host
# or a WireGuard/Tailscale network. For LAN TLS, override the command with
# --tls-cert/--tls-key and a non-loopback bind, or terminate at a proxy.
#
# Deliberately absent: vault (dev-only compose; promotion needs real
# storage + init/unseal + TLS — see docker-compose.vault.yml header),
# pgvector (dormant by design, Q-34; start docker-compose.hindsight.yml
# explicitly if a memory experiment needs it).
#
# Up:   docker compose --env-file .env -f platform/docker/compose.prod.yml up --build -d
# Down: docker compose -f platform/docker/compose.prod.yml down
#
# Writes need KUBONA_API_TOKEN in the environment (export it first):
# unset means bearer-gated routes 503 with "API token not configured"
# (fail-closed, by design). Reads stay public behind limiters.
# Generate operator/reviewer keys with: kubonad keygen

name: kubona-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    image: kubona/bridge:prod
    <<: *default-hardening
    environment:
      KUBONA_ENV: "production"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      # The bridge is a private compute plane. Production transport is
      # UDS-exclusive over the shared bridge-sock volume: no TCP socket
      # exists at all (the bridge refuses TCP in KUBONA_ENV=production),
      # so there is nothing to sniff or to bind. kubonad dials the same
      # socket path. Both images run as UID 1000 and both bake
      # /run/kubona owned by kubona:kubona so the seeded volume is
      # writable. If the token is unset the bridge still refuses to
      # serve authenticated RPCs (fail-closed).
      KUBONA_BRIDGE_SOCKET: /run/kubona/bridge.sock
      KUBONA_BRIDGE_TOKEN: ${KUBONA_BRIDGE_TOKEN:-${KUBONA_API_TOKEN:-}}
      # IBM credentials are consumed by the bridge's qiskit provider, not
      # by kubonad. Keep them explicit so the private compute plane can
      # dispatch without baking secrets into the image.
      KUBONA_IBM_QISKIT_TOKEN: ${KUBONA_IBM_QISKIT_TOKEN:-}
      KUBONA_IBM_QISKIT_INSTANCE: ${KUBONA_IBM_QISKIT_INSTANCE:-}
      KUBONA_IBM_QISKIT_CHANNEL: ${KUBONA_IBM_QISKIT_CHANNEL:-ibm_quantum_platform}
      KUBONA_IBM_QISKIT_BACKEND: ${KUBONA_IBM_QISKIT_BACKEND:-}
      KUBONA_IBM_MAX_EXECUTION_SECONDS: ${KUBONA_IBM_MAX_EXECUTION_SECONDS:-600}
      # Bridge-side spend-approval key (cost MCP rail). Optional; unset
      # refuses to mint rather than inventing authority.
      KUBONA_OPERATOR_PRIVKEY_HEX: ${KUBONA_OPERATOR_PRIVKEY_HEX:-}
    volumes:
      - bridge-sock:/run/kubona
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('unix:///run/kubona/bridge.sock')).result(timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s

  # Preflight gate: read-only rate-card, ledger chain/schema, FK, and backup
  # checks. kubonad starts only after this exits 0. A fresh state is valid;
  # set KUBONA_PREFLIGHT_REQUIRE_BACKUP=1 once the backup profile is active.
  preflight:
    image: kubona/kubonad:prod
    <<: *default-hardening
    entrypoint: ["/usr/local/bin/kubonad", "preflight"]
    command:
      - "--db"
      - "/home/kubona/.kubona/kubona.db"
      - "--backup-dir"
      - "/backups"
      - "--max-backup-age"
      - "${KUBONA_BACKUP_MAX_AGE:-26h}"
    environment:
      KUBONA_ENV: "production"
      KUBONA_DB_PATH: /home/kubona/.kubona/kubona.db
      KUBONA_BACKUP_DIR: /backups
      KUBONA_BACKUP_MAX_AGE: ${KUBONA_BACKUP_MAX_AGE:-26h}
      KUBONA_PREFLIGHT_REQUIRE_BACKUP: ${KUBONA_PREFLIGHT_REQUIRE_BACKUP:-0}
      KUBONA_RATE_CARD_PATH: ${KUBONA_RATE_CARD_PATH:-}
      KUBONA_RATE_CARD_URL: ${KUBONA_RATE_CARD_URL:-}
      KUBONA_LLM_CLOUD: ${KUBONA_LLM_CLOUD:-}
    volumes:
      # rw, not ro: SQLite WAL readers may need the shared-memory sidecar;
      # preflight itself writes nothing.
      - kubona-state:/home/kubona/.kubona
      - kubona-backups:/backups
    restart: "no"

  kubonad:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kubonad
      args:
        VERSION: ${KUBONA_VERSION:-dev}
    image: kubona/kubonad:prod
    <<: *default-hardening
    # Container-internal bind is 0.0.0.0 so Docker's healthcheck and the
    # loopback-published host port work. The HOST exposure is the boundary:
    # ports below publish to 127.0.0.1 only. Do not change the ports block
    # to a bare "8080:8080" — that is the public-listener regression.
    command: ["--bind", "0.0.0.0", "--port", "8080"]
    environment:
      KUBONA_ENV: "production"
      # Bridge dial: --bridge flag intentionally left at its default
      # (localhost:50051) so KUBONA_BRIDGE_SOCKET takes precedence in
      # kubonad's dial logic — the Go side joins the same UDS, never TCP.
      KUBONA_BRIDGE_SOCKET: /run/kubona/bridge.sock
      # Explicit single-lab posture (Q-57). Set to "0" for a multi-lab
      # deployment; anonymous session reads then require auth.
      KUBONA_SINGLE_LAB: ${KUBONA_SINGLE_LAB:-1}
      KUBONA_API_TOKEN: ${KUBONA_API_TOKEN:-}
      # 32-byte hex/base64 key for AES-256-GCM sealing of UI-entered LLM
      # provider keys in the local ledger. Set it for production; unset
      # keeps legacy plaintext readable (dev migration) and logs a warning.
      KUBONA_SECRET_KEY: ${KUBONA_SECRET_KEY:-}
      # >=32 chars; required for /api/vault/leases (secret lease rail).
      KUBONA_LEASE_HMAC_KEY: ${KUBONA_LEASE_HMAC_KEY:-}
      # Shared secret for the private bridge RPCs. Defaults to the API
      # token so the supported quickstart needs one value, not two.
      KUBONA_BRIDGE_TOKEN: ${KUBONA_BRIDGE_TOKEN:-${KUBONA_API_TOKEN:-}}
      # Human-reviewer mandate key. Without it, production refuses to sign
      # mandates (ephemeral signers are dev-only). Generate with:
      #   kubonad keygen
      KUBONA_REVIEWER_PRIVKEY_HEX: ${KUBONA_REVIEWER_PRIVKEY_HEX:-}
      KUBONA_OPERATOR_PRIVKEY_HEX: ${KUBONA_OPERATOR_PRIVKEY_HEX:-}
      # Cloud LLM is opt-in, and the provider key is the operator's own
      # (BYOK): the provider bills that key; Kubona only records an estimate
      # and enforces a local guardrail. Air-gap stays on by default.
      KUBONA_LLM_CLOUD: ${KUBONA_LLM_CLOUD:-}
      # Runtime vendor rate card (preferred for cloud LLM; production cloud
      # pricing refuses the embedded bootstrap). File paths inside the
      # container need a mount; a URL is fetched by kubonad with HTTPS.
      KUBONA_RATE_CARD_PATH: ${KUBONA_RATE_CARD_PATH:-}
      KUBONA_RATE_CARD_URL: ${KUBONA_RATE_CARD_URL:-}
      KUBONA_LLM_BUDGET_USD: ${KUBONA_LLM_BUDGET_USD:-}
      KUBONA_CODESIGN_RUN_BUDGET_USD: ${KUBONA_CODESIGN_RUN_BUDGET_USD:-0.50}
      KUBONA_LLM_PROVIDER: ${KUBONA_LLM_PROVIDER:-}
      KUBONA_LLM_MODEL: ${KUBONA_LLM_MODEL:-}
      KUBONA_LLM_CODESIGN_PROVIDER: ${KUBONA_LLM_CODESIGN_PROVIDER:-}
      KUBONA_LLM_CODESIGN_MODEL: ${KUBONA_LLM_CODESIGN_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      # Audit 2026-10-21: Strata is the default provider (local, keyless),
      # but the stack never configured its model — every LLM path refused
      # with "no model configured" on a stock up. .env.example names iq3_s
      # as the default; the compose default matches it (overridable via
      # environment, never a rebuild).
      STRATA_MODEL: ${STRATA_MODEL:-iq3_s}
      # Strata serves on the HOST's loopback (serving panel default
      # 127.0.0.1:47831), which is not the container's loopback.
      # host.docker.internal resolves on Docker Desktop (Mac/Win) and via
      # host-gateway on Linux (see extra_hosts below); verified live
      # 2026-10-21 (models list answers through it). Point STRATA_BASE_URL
      # elsewhere only if Strata itself moves.
      STRATA_BASE_URL: ${STRATA_BASE_URL:-http://host.docker.internal:47831/v1}
      # Plain HTTP inside the compose network only: kubonad itself
      # refuses non-loopback plaintext without TLS or this explicit
      # opt-in. TLS terminates in front (reverse proxy) or via mounted
      # PEM + --tls-cert/--tls-key flags — never expose :8080 directly.
      KUBONA_ALLOW_PLAINTEXT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    # Runbook: if host localhost:8080 answers with sessions the stack
    # never created, a dev daemon owns the host port (it binds before /
    # beside Docker's forward). The stack itself is unaffected — probe it
    # in-network (docker exec <svc> curl kubonad:8080/...) — but stop the
    # dev daemon before trusting host-port curls.
    volumes:
      - kubona-state:/home/kubona/.kubona
      - bridge-sock:/run/kubona
    tmpfs:
      - /tmp
    depends_on:
      bridge:
        condition: service_healthy
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Optional profile: verified scheduled backups. Enable with
  #   docker compose ... --profile backup up -d
  # Set KUBONA_BACKUP_AGE_RECIPIENT (and KUBONA_BACKUP_REQUIRE_ENCRYPTION=1
  # for a hard requirement). The healthcheck goes unhealthy when the newest
  # verified backup is older than KUBONA_BACKUP_MAX_AGE.
  backup:
    profiles: ["backup"]
    image: kubona/kubonad:prod
    <<: *default-hardening
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    environment:
      HOME: /home/kubona
      KUBONA_DB_PATH: /home/kubona/.kubona/kubona.db
      KUBONA_BACKUP_DIR: /backups
      KUBONA_BACKUP_INTERVAL_SECONDS: ${KUBONA_BACKUP_INTERVAL_SECONDS:-86400}
      KUBONA_BACKUP_KEEP: ${KUBONA_BACKUP_KEEP:-7}
      KUBONA_BACKUP_AGE_RECIPIENT: ${KUBONA_BACKUP_AGE_RECIPIENT:-}
      KUBONA_BACKUP_REQUIRE_ENCRYPTION: ${KUBONA_BACKUP_REQUIRE_ENCRYPTION:-0}
      KUBONA_BACKUP_MAX_AGE: ${KUBONA_BACKUP_MAX_AGE:-26h}
    volumes:
      - kubona-state:/home/kubona/.kubona
      - kubona-backups:/backups
    tmpfs:
      - /tmp
    depends_on:
      kubonad:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "/usr/local/bin/kubonad", "backup-status", "--dir", "/backups", "--max-age", "${KUBONA_BACKUP_MAX_AGE:-26h}"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 60s

  console:
    build:
      context: ../console
      dockerfile: ../docker/Dockerfile.console
      args:
        NEXT_PUBLIC_API_URL: ${KUBONA_CONSOLE_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_KUBONA_VERSION: ${KUBONA_VERSION:-dev}
    image: kubona/console:prod
    <<: *default-hardening
    environment:
      HOME: /tmp
      # Server-side proxy target for the same-origin Atlas image route.
      KUBONA_INTERNAL_API_URL: http://kubonad:8080
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp
      - /app/.next/cache
    depends_on:
      kubonad:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  kubona-state:
  kubona-backups:
  bridge-sock:
