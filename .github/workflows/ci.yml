name: CI

# Least privilege: no job in this pipeline publishes, pushes, or needs
# anything beyond reading the tree — so the token gets read-only contents.
# PR builds (including forks) therefore cannot write back anywhere. Action
# versions stay pinned as tags (a SHA-pinning bot is future work, not a
# silent downgrade to floating latest).
permissions:
  contents: read

on:
  push:
    # `develop` belongs here: the gate previously observed only `main`, which this repo
    # advances by fast-forwarding develop onto it. Net effect was that no commit was ever
    # gated *as it landed* -- a broken gate stayed green-looking for as long as nobody
    # advanced main. `workflow_dispatch` exists so a suspect gate can be re-run against the
    # current HEAD without inventing a push to force it.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret + local-path scan (versioned pre-commit mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked tree for secrets and local-only paths
        run: ./scripts/secret-scan.sh

  python-tests:
    name: Python tests (121+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust qir-core (production compiler core)
        run: cargo build --release --manifest-path crates/qir-core/Cargo.toml
      - run: pip install -e ".[dev,qiskit]" pyscf
      - name: Full python suite (Rust core wired; KUBONA_QIR_CORE)
        env:
          KUBONA_QIR_CORE: ${{ github.workspace }}/platform/crates/qir-core/target/release/qir-core
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs
      - name: doctor (state-root + fail-closed config check)
        run: |
          KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.run doctor
          KUBONA_ENV=production KUBONA_STATE_DIR="$(mktemp -d)" \
            python -c 'import kubona.config as c; assert c.console_token() is None; assert c.is_production()'
      - name: Wiki structural lint (blueprint invariants)
        working-directory: .
        run: python scripts/wiki-lint.py --strict

  rust-tests:
    name: Rust crates (qir-core + ifc-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test qir-core
        working-directory: platform/crates/qir-core
        run: cargo test --lib
      - name: Test ifc-core
        working-directory: platform/crates/ifc-core
        run: cargo test --lib

  canary-gate:
    name: Canary + correctness release-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,qiskit]"
      - name: Hardware canary (simulator/GA providers)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.canary
      - name: Correctness-regression harness (release gate)
        run: |
          KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.canary --gate

  go-core-tests:
    name: Go Orchestrator Core (tests + race detector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # Harness tests shell out to host python3 for embedded eval scripts
      # (numpy+qiskit): without them every harness test fails on import.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy "qiskit>=1.0" "qiskit-aer>=0.14"
      - run: go test -v -race ./...

  nextjs-console-build:
    name: Next.js Observatory Console (TypeScript build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: platform/console/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm build

