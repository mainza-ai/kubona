name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Python tests (121+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust qir-core (production compiler core)
        run: cargo build --release --manifest-path crates/qir-core/Cargo.toml
      - run: pip install -e ".[dev,qiskit]"
      - name: Full python suite (Rust core wired; KUBONA_QIR_CORE)
        env:
          KUBONA_QIR_CORE: ${{ github.workspace }}/platform/crates/qir-core/target/release/qir-core
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q
      - name: doctor (state-root + fail-closed config check)
        run: |
          KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.run doctor
          KUBONA_ENV=production KUBONA_STATE_DIR="$(mktemp -d)" \
            python -c 'import kubona.config as c; assert c.console_token() is None; assert c.is_production()'
      - name: Wiki structural lint (blueprint invariants)
        working-directory: .
        run: python scripts/wiki-lint.py --strict

  rust-tests:
    name: Rust qir-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/crates/qir-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release  # production compiler core
      - run: cargo test --lib  # 3 qir-core unit tests

  canary-gate:
    name: Canary + correctness release-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,qiskit]"
      - name: Hardware canary (simulator/GA providers)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.canary
      - name: Correctness-regression harness (release gate)
        run: |
          KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.canary --gate

  flutter-console:
    name: Flutter web console (build + widget test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/console
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web

