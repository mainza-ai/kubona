name: CI

# Least privilege: no job in this pipeline publishes, pushes, or needs
# anything beyond reading the tree — so the token gets read-only contents.
# PR builds (including forks) therefore cannot write back anywhere. Actions
# pin to commit SHAs (tag in trailing comment); re-pin deliberately, never
# by floating forward.
permissions:
  contents: read

on:
  push:
    # `develop` belongs here: the gate previously observed only `main`, which this repo
    # advances by fast-forwarding develop onto it. Net effect was that no commit was ever
    # gated *as it landed* -- a broken gate stayed green-looking for as long as nobody
    # advanced main. `workflow_dispatch` exists so a suspect gate can be re-run against the
    # current HEAD without inventing a push to force it.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # R0: fail-fast lane. Lint + secret scan run first and every heavy job
  # waits on them (needs:) — a blueprint violation or leaked secret skips
  # the 30-minute suites instead of being buried at step 55 behind them.
  wiki-lint:
    name: Wiki structural lint (fail-fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Wiki structural lint (blueprint invariants)
        run: python scripts/wiki-lint.py --strict

  secret-scan:
    name: Secret + local-path scan (versioned pre-commit mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan tracked tree for secrets and local-only paths
        run: ./scripts/secret-scan.sh

  dco-check:
    name: DCO sign-off on new commits (CONTRIBUTING.md)
    # Dependabot cannot sign: its updates are reviewed, not authored.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # DCO needs history, not just HEAD: full clone for the range walk.
          fetch-depth: 0
      - name: Require Signed-off-by on commits new to the branch
        run: ./scripts/dco-check.sh
        env:
          # push: before..after; pull_request: base..head; dispatch (nothing
          # landed): NONE sentinel, the gate is vacuously green.
          DCO_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || 'NONE' }}
          DCO_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  python-tests:
    name: "Python suite (fast lane: everything except paper-scale slices)"
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    # Launch-day red (2026-10-22): the serial suite died at ~40 min with
    # the paper-scale hogs still queued. Lane selection is by path, not
    # by marker: every tests/test_codesign_slice*.py file rides the slow
    # shards below, so new slice files land there with no tagging step.
    # timeout-minutes fails fast and loud; --durations names any new hog
    # that slips into the fast lane.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      # Counts are generated, not hand-maintained (README/wiki drift fix).
      # The step is source-only; it does not need Go/Rust/Node.
      - name: Repository counts are current
        working-directory: .
        run: python3 scripts/repo-counts.py --check
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # R0: this job rebuilds qir-core for the Python suite — without
          # the cargo cache every run recompiled it from scratch.
          cache: true
      - name: Build Rust qir-core (production compiler core)
        run: cargo build --release --manifest-path crates/qir-core/Cargo.toml
      # W2.4: install the suite-verified set — qiskit/chemistry extras pinned
      # == in pyproject (floors previously resolved untested combos; the
      # chemistry extra was missing so RDKit coverage silently skipped).
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0 "pytest-cov==7.1.0"
      # Phase-1 depth: coverage hold-the-line floor. Measured 57% 2026-10-28
      # (fast lane: tests/ minus paper-scale slices, --cov=kubona; local
      # py3.12/macOS vs CI py3.11/ubuntu, so the floor carries epsilon).
      # Floor 55 = measured minus epsilon: the ratchet never drops, only
      # rises — raise --cov-fail-under after a sustained green run higher.
      # bridge/ is exercised by its own suite below but excluded from the
      # floor (unify the coverage invocations as follow-up).
      - name: Full python suite, fast lane (KUBONA_QIR_CORE wired)
        env:
          KUBONA_QIR_CORE: ${{ github.workspace }}/platform/crates/qir-core/target/release/qir-core
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs --ignore-glob='*/test_codesign_slice*.py' --durations=20 --cov=kubona --cov-report=term-missing --cov-fail-under=55
      # Bridge contract suite lives outside testpaths (bridge/test_bridge.py)
      # so the default run skips it — a red bridge test went unnoticed.
      # It is fast (~seconds) and hermetic (no creds, no network).
      - name: Bridge contract suite (credential fail-closed pins)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest bridge/test_bridge.py bridge/test_quantum_rpc.py -q
      - name: doctor (state-root + fail-closed config check)
        run: |
          KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.run doctor
          KUBONA_ENV=production KUBONA_STATE_DIR="$(mktemp -d)" \
            python -c 'import kubona.config as c; assert c.console_token() is None; assert c.is_production()'
      # R0: wiki-lint is its own fail-fast job (top of this file) —
      # it no longer hides here behind the full suite.

  # Paper-scale shards (2026-10-22 launch triage): the codesign slice files
  # are exhaustive/paper-scale verification by construction — minutes per
  # test on a 2-core runner. They run here, sharded by file so one slow
  # family never holds the others hostage. No Rust build: slice tests do
  # not touch qir-core (verified by grep). Same pip env everywhere so a
  # passing fast lane plus passing shards means the full suite is green.
  # Paper-scale shards (launch-day triage 2026-10-22): every
  # tests/test_codesign_slice*.py file rides a slow shard by path, so new
  # slice files land in shard A-D automatically — but ONLY if the glob
  # below keeps covering them; files 58/59/60 and the composition test
  # have dedicated shards because single files exceed the shared ceiling.
  # The fast job's --durations output names any test that outgrows its
  # shard; split the file, never raise the timeout first.
  python-slow-a:
    name: Python paper-scale A (slices 0-32)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Python paper-scale A (slices 0-32)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs tests/test_codesign_slice[12]*.py tests/test_codesign_slice[3-9].py tests/test_codesign_slice3[0-2].py --durations=20

  python-slow-b:
    name: Python paper-scale B (slices 33-47)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Python paper-scale B (slices 33-47)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs tests/test_codesign_slice3[3-9].py tests/test_codesign_slice4[0-7].py --durations=20

  python-slow-c:
    name: Python paper-scale C (slices 48-57, 61-62)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Python paper-scale C (slices 48-57, 61-62)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs tests/test_codesign_slice4[89].py tests/test_codesign_slice5[0-7].py tests/test_codesign_slice6[12].py --durations=20

  python-slow-d:
    name: Python paper-scale D (slice58 walks)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Python paper-scale D (slice58 walks)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs tests/test_codesign_slice58.py --durations=20

  python-slow-e:
    name: Python paper-scale E (slice59 EEA)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Python paper-scale E (slice59 EEA)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q -rs tests/test_codesign_slice59.py --durations=20

  # Slice60 (composition + determinism) is thesis-scale: each test can
  # exceed 30 minutes and was being preempted on the PR runners. It now
  # runs in nightly-canary.yml with a 180-minute budget. The slice-coverage
  # guard (tests/test_ci_slice_coverage.py) reads every workflow, so moving
  # a slice here cannot make it invisible.

  sandbox-container:
    name: Sandbox container (build + live execution)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the hardened runner image
        run: docker build -f platform/docker/Dockerfile.quantum-runner -t kubona-quantum-runner:1.1.0 platform
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
        working-directory: platform
      - name: Live container execution + refusal pins
        working-directory: platform
        env:
          KUBONA_SANDBOX_CONTAINER: "1"
          KUBONA_SANDBOX_IMAGE: kubona-quantum-runner:1.1.0
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m pytest -q tests/test_watchdog_and_sandbox.py -k container_sandbox

  rust-tests:
    name: Rust crates (qir-core + ifc-core)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          cache: true
      - name: Test qir-core
        working-directory: platform/crates/qir-core
        run: cargo test --lib
      - name: Test ifc-core
        working-directory: platform/crates/ifc-core
        run: cargo test --lib

  # D1: the production stack must be deployable on every commit — images
  # build, the daemon is ready on a FRESH state root (exercises
  # ensureStateDirs: a missing models dir used to latch /api/ready 503
  # forever), the console serves, the bridge answers gRPC, and an
  # unauthenticated abort fails closed (503, never 2xx).
  docker-smoke:
    name: Docker production stack (build + health smoke)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bring up the production stack
        env:
          # The bridge now refuses non-loopback without a token. Keep the
          # API token unset so the abort check below still exercises the
          # fail-closed 503 path.
          KUBONA_BRIDGE_TOKEN: ci-bridge-token
        run: docker compose -f platform/docker/compose.prod.yml up --build -d
      - name: Kubonad ready on a fresh state root
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/ready && break || sleep 10
          done
          curl -sf http://127.0.0.1:8080/api/ready
      - name: Console serves + bridge answers gRPC
        run: |
          # D2: the console boots slower than kubonad becomes ready — the
          # pre-launch smoke curled :3000 in the same second the container
          # started (exit 56) and failed a healthy stack. Wait like the
          # /api/ready loop above instead of curling once.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break || sleep 10
          done
          curl -sf http://127.0.0.1:3000/ > /dev/null
          docker exec kubona-prod-bridge-1 python -c "import grpc; grpc.channel_ready_future(grpc.insecure_channel('unix:///run/kubona/bridge.sock')).result(timeout=10); print('bridge grpc ok (uds-exclusive, no TCP)')"
      - name: Smoke logs on failure (console/bridge/kubonad tails)
        if: failure()
        run: |
          docker compose -f platform/docker/compose.prod.yml logs --tail=60 console || true
          docker compose -f platform/docker/compose.prod.yml logs --tail=30 bridge || true
          docker compose -f platform/docker/compose.prod.yml logs --tail=30 kubonad || true
      - name: Unauthenticated abort fails closed (503, never 2xx)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/supervisor/abort -H 'Content-Type: application/json' -d '{"session_id":"ci-smoke"}')
          test "$code" = "503"
      - name: Tear down the stack
        if: always()
        run: docker compose -f platform/docker/compose.prod.yml down -v

  canary-gate:
    name: Canary + correctness release-gate
    runs-on: ubuntu-latest
    # R0: the release gate actually gates — it runs only when every suite
    # above is green. Previously it ran in parallel, so a red suite and a
    # green gate coexisted and the gate meant nothing.
    # Phase-1 depth: the hermetic gates (go-lint, python-lint, rust-lint,
    # image-scan promoted into needs 2026-10-29 after its first
    # verified-green CI run (run 40786519756, all 20 checks green).
    # sast) join the release gate — no release ships with new lint, SAST, or
    # coverage-floor debt.
    needs: [wiki-lint, secret-scan, python-tests, python-slow-a, python-slow-b, python-slow-c, python-slow-d, python-slow-e, rust-tests, go-core-tests, nextjs-console-build, docker-smoke, sandbox-container, go-lint, python-lint, rust-lint, sast, image-scan]
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit,chemistry]"
      - name: Hardware canary (simulator/GA providers)
        run: KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.canary
      - name: Correctness-regression harness (release gate)
        run: |
          KUBONA_STATE_DIR="$(mktemp -d)" python -m kubona.canary --gate

  go-core-tests:
    name: Go Orchestrator Core (tests + race detector)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    defaults:
      run:
        working-directory: platform/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # W2.4: must match go.mod (1.23 silently built a newer toolchain's code).
          # 1.27.2 (was 1.27.1): patch bump for Go stdlib Trivy CRITICAL
          # CVE-2026-56857, fixed in 1.27.2 — the image-scan gate demands it.
          go-version: "1.27.2"
          cache-dependency-path: platform/core/go.sum
      # Harness tests shell out to host python3 for embedded eval scripts
      # (numpy+qiskit): without them every harness test fails on import.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      # W2.4: suite-verified pins (== in pyproject), never floors.
      - run: pip install "numpy==2.4.6" "qiskit==2.5.2" "qiskit-aer==0.17.2"
      # Launch-day red (2026-10-22): three codesign proxy tests 503d here
      # while green locally. Two compounding causes: (1) findPythonVenv
      # handed exec a nonexistent dir whenever no dev venv exists (fixed
      # in server.go to never return a missing dir); (2) the kubona
      # package itself was never installed, so even with a valid dir the
      # snippets died on import. Install it (base set only — the codesign
      # chain is stdlib-only, verified import graph). Chemistry extras are
      # deliberately absent: their tests skip without rdkit by design.
      - name: Install kubona package (local-exec rail for codesign tests)
        working-directory: platform
        run: pip install -e .
      - run: go test -v -race -coverprofile="$RUNNER_TEMP/cover.out" ./...
      # Phase-1 depth: Go coverage hold-the-line floor. MEASURED 66.3%
      # with the pinned go1.27.2 toolchain (full ./..., local macOS).
      # Caution, learned 2026-10-28: the same tree measures 74.4% under
      # go1.27.1 — coverage instrumentation granularity changed between
      # the two toolchains, so the ruler is toolchain-dependent. Always
      # re-baseline this floor when go.mod moves, and record both numbers
      # here. Floor 64 = 66.3 minus epsilon; the ratchet never drops,
      # only rises — raise it after a sustained green run at a higher
      # number. Generated `core/proto` (0% by construction) is included
      # in the total; excluding it is a follow-up, not a silent tweak.
      - name: Coverage floor (ratchet, fail below 64%)
        run: |
          total=$(go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')
          echo "Go total coverage: ${total}% (floor 64%, toolchain go1.27.2)"
          awk "BEGIN {exit !((${total:-0} + 0) >= 64)}" || { echo "Go coverage ${total}% below floor 64%"; exit 1; }

  nextjs-console-build:
    name: Next.js Observatory Console (tests + lint + build)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    defaults:
      run:
        working-directory: platform/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Dead-export guard: a new function export from lib/api.ts with no
      # non-test consumer fails the console job. The 13 deferred entries
      # are explicit and dated; a stale entry also fails.
      - name: No new dead client exports
        working-directory: .
        run: python3 scripts/console-dead-exports.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: platform/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # U0: the 103 vitest tests + eslint previously ran nowhere in CI —
      # the console could rot green while build-only stayed green. Test
      # first (fastest signal), then lint, then build.
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  # Phase-1 verification depth (2026-10-28): lint + SAST + image scan.
  # ADD jobs, never rename required-check contexts (branch protection keys
  # on job names). Every depth gate fails the build on violation — there is
  # no warnings-only mode anywhere in this section.
  go-lint:
    name: Go vet + gofmt (fail on violation)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    defaults:
      run:
        working-directory: platform/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: platform/core/go.sum
      # go vet is the type-level gate; gofmt -l is the formatting gate.
      # Verified green 2026-10-28 (3 misaligned files fixed with gofmt -w
      # in the same slice; `go vet ./...` was already clean).
      - run: go vet ./...
      - name: gofmt clean (fail on any unformatted file)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt violations:"; echo "$unformatted"; exit 1; fi

  python-lint:
    name: Ruff check (hold-the-line ratchet)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      # The tree carries 375 pre-existing violations (2026-10-28; mostly
      # F401 unused-imports and E402 path bootstraps — see
      # .github/ruff-baseline.txt for the breakdown, measured on HEAD plus
      # this slice's own fixes). Full `ruff check` green is the backlog
      # goal; until then this job fails ONLY when the count rises above the
      # pinned baseline — never on the existing debt, never silently on new
      # debt. `ruff format --check` is deliberately absent: 356 files are
      # unformatted, so a format gate would cry wolf on day one (check-only
      # lane; revisit after a formatting pass).
      - run: pip install "ruff==0.15.21"
      - name: Ruff hold-the-line (fail if violations increase)
        run: |
          ruff check kubona bridge tests --output-format concise > /tmp/ruff.out 2> /tmp/ruff.err || true
          count=$(grep -cE ":[0-9]+:[0-9]+:" /tmp/ruff.out || true)
          if grep -q "All checks passed" /tmp/ruff.out; then reported=0; else reported=$(grep -oE "Found [0-9]+ errors" /tmp/ruff.out | grep -oE "[0-9]+" || true); fi
          baseline=$(grep -v '^#' "${{ github.workspace }}/.github/ruff-baseline.txt")
          echo "ruff violations: ${count} (baseline ${baseline}, $(ruff --version))"
          if [ -z "$reported" ]; then echo "ruff produced no summary — tool or config failure:"; cat /tmp/ruff.err; exit 1; fi
          if [ "$count" != "$reported" ]; then echo "ruff parse mismatch (parsed ${count} vs reported ${reported})"; exit 1; fi
          if [ "$count" -gt "$baseline" ]; then echo "ruff violations rose ${baseline} -> ${count}: fix the code, do not raise the baseline without justification"; exit 1; fi

  rust-lint:
    name: Cargo clippy (deny warnings)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          cache: true
      # clippy -D warnings fails the build on any lint (libs + tests + bins
      # via --all-targets). Verified green 2026-10-28 on qir-core and
      # ifc-core. Known maintenance trade-off: a future stable toolchain can
      # add lints that fail this job with no code change — that failure is
      # real signal (fix the lint), not flake.
      - name: Clippy qir-core (deny warnings)
        working-directory: platform/crates/qir-core
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy ifc-core (deny warnings)
        working-directory: platform/crates/ifc-core
        run: cargo clippy --all-targets -- -D warnings

  sast:
    name: Semgrep SAST (vendored high-signal ruleset)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      # One SAST gate, not two: Semgrep with a vendored 11-rule python+go
      # ruleset (.github/semgrep.yml) instead of Bandit+Gosec. Why: a single
      # hermetic offline run (vendored rules, no --config auto network
      # fetch) covering the same high-signal classes (shell-True/os.system/
      # os.exec*, weak hashes without usedforsecurity=False, requests
      # verify=False / CERT_NONE, yaml.load/pickle, Go sh -c / md5-sha1 /
      # InsecureSkipVerify). Bandit high/high needed the identical sha1 fix
      # and Gosec reports 164 findings (mostly G104 unhandled-error LOWs) —
      # too noisy to gate on; both are documented residuals, not gates.
      # --error exits 1 on any match: a new dangerous pattern fails the
      # build. Ruleset verified green 2026-10-28 AND verified to fire on
      # planted bad patterns (not vacuous).
      - run: pip install "semgrep==1.182.1"
      - name: Semgrep (fail on any match)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep --config .github/semgrep.yml --error platform/kubona platform/bridge platform/core

  image-scan:
    name: Trivy image scan (prod images, CRITICAL gate)
    runs-on: ubuntu-latest
    needs: [wiki-lint, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Trivy scans the three prod images docker-smoke deploys
      # (kubonad/bridge/console). Threshold: CRITICAL. Why not HIGH: the
      # three images carry 80/46/67 HIGHs today (mostly distro churn) — a
      # HIGH gate would cry wolf on day one; ratchet to HIGH after the
      # backlog is triaged. Images build fresh here (hermetic, no registry).
      # .trivyignore pins the ONE accepted residual (console zlib1g, no
      # distro fix available); every other CRITICAL fails the build.
      # Verified locally 2026-10-28: kubonad needed a go1.27.2 bump
      # (CVE-2026-56857, fixed same-slice) plus apt-get upgrade in the final
      # stage for brotli/perl CRITICALs; bridge/console green modulo the
      # zlib pin. Promoted into canary-gate needs 2026-10-29 after the
      # first verified-green run.
      - name: Build prod images
        run: docker compose -f platform/docker/compose.prod.yml build
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubona/kubonad:prod
          format: table
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubona/bridge:prod
          format: table
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubona/console:prod
          format: table
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

