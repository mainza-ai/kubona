name: Nightly Canary

# Same least-privilege posture as CI: read-only tree, no publishing.
# Actions pin to commit SHAs (tag in trailing comment), mirroring ci.yml —
# re-pin deliberately, never by floating forward.
#
# 2026-10-29 stale-state audit: three consecutive nightly runs were
# cancelled by a runner shutdown, not by an assertion. The thesis-scale
# tests are bounded at 150 minutes and the runner capacity is printed so a
# platform/OOM failure is distinguishable from a test hang.
#
# 2026-10-30: Builder now stores ops in compact typed columns and the tests
# stream them instead of materialising a 126M-object list. Local peaks are
# 3.4 GiB (composition) / 5.0 GiB (determinism), down from ~37 GiB, so the
# hosted 15 GiB runner should hold them. Keep the gate and the capacity print;
# prove it with a manual run before calling nightly green.
permissions:
  contents: read

on:
  schedule:
    - cron: "17 3 * * *"   # nightly
  workflow_dispatch:        # manual repro for runner-capacity investigations

jobs:
  canary:
    name: Nightly hardware canary + correctness regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,qiskit]"
      - name: Run canary with ledger record
        run: |
          mkdir -p state
          KUBONA_STATE_DIR="$PWD/state" python -m kubona.canary
      - name: Correctness-regression harness
        run: |
          KUBONA_STATE_DIR="$PWD/state" python -m pytest tests/test_autoresearch.py -k correctness -q
      - name: Upload canary ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-ledger
          path: platform/state/
          if-no-files-found: ignore

  # Thesis-scale slices moved out of the PR gate (2026-10-26): each test
  # exceeded 30 minutes and was preempted on 2-core PR runners. Nightly
  # gets a 180-minute budget and a fresh runner.
  slice60-composition:
    name: Slice60 composition (thesis-scale, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Runner capacity (diagnose shutdowns)
        run: |
          free -h
          ulimit -a
          nproc
      - name: Add swap (thesis-scale memory headroom)
        continue-on-error: true
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || echo "swap unavailable on this runner"
          free -h
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Slice60 test_rs_composition_end_to_end (bounded)
        env:
          PYTHONUNBUFFERED: "1"
        run: KUBONA_STATE_DIR="$(mktemp -d)" timeout 9000 python -m pytest -q -rs "tests/test_codesign_slice60.py::test_rs_composition_end_to_end" --durations=20

  slice60-determinism:
    name: Slice60 determinism (thesis-scale, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Runner capacity (diagnose shutdowns)
        run: |
          free -h
          ulimit -a
          nproc
      - name: Add swap (thesis-scale memory headroom)
        continue-on-error: true
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || echo "swap unavailable on this runner"
          free -h
      - run: pip install -e ".[dev,qiskit,chemistry]" pyscf==2.14.0
      - name: Slice60 test_rs_pins_determinism_layout (bounded)
        env:
          PYTHONUNBUFFERED: "1"
        run: KUBONA_STATE_DIR="$(mktemp -d)" timeout 9000 python -m pytest -q -rs "tests/test_codesign_slice60.py::test_rs_pins_determinism_layout" --durations=20

  console-perf:
    name: Console 100/300-object FPS (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: platform/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: NEXT_PUBLIC_KUBONA_CONSOLE_TOKEN= pnpm build
      - name: Start console
        run: |
          pnpm start > /tmp/console-perf.log 2>&1 &
          echo $! > /tmp/console-perf.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/console-perf.log
          exit 1
      - name: Run 100/300-object FPS gate
        env:
          KUBONA_PERF: "1"
          KUBONA_CONSOLE_URL: http://127.0.0.1:3000
        run: pnpm exec playwright test e2e/workbench-perf.spec.ts --reporter=list
      - name: Stop console
        if: always()
        run: kill "$(cat /tmp/console-perf.pid)" 2>/dev/null || true
