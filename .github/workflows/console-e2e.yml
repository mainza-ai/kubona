name: Console E2E

# Browser-level acceptance against the real local-first compose stack. This
# is deliberately separate from the fast unit lanes: it builds the production
# images, starts loopback-only services, and drives Chrome through the operator
# journey (admin bootstrap -> login -> local dispatch -> codesign).
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-e2e:
    name: Console E2E (real compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KUBONA_API_TOKEN: e2e-token
      KUBONA_SINGLE_LAB: "1"
      KUBONA_ENV: production
      E2E_OPERATOR_TOKEN: e2e-token
      PLAYWRIGHT_CHANNEL: chromium
      KUBONA_CONSOLE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/console/pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install console + browser
        working-directory: platform/console
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Boot production stack
        run: |
          docker compose -f platform/docker/compose.prod.yml up --build -d
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/ready >/dev/null \
               && curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              echo "stack ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          exit 1

      - name: Run console E2E
        working-directory: platform/console
        run: pnpm test:e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f platform/docker/compose.prod.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f platform/docker/compose.prod.yml down -v
